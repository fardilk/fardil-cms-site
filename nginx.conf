server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml font/woff2;

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /webfonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # React Router owns the routes, so unknown paths must return the shell.
  #
  # These headers live here rather than at server level on purpose: an
  # add_header inside a location replaces the parent's set rather than adding
  # to it, so server-level headers would vanish for exactly the responses that
  # need them.
  location / {
    try_files $uri $uri/ /index.html;

    # An admin panel has no business in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
  }
}
